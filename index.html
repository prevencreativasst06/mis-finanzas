<style>
:root{--bg:#f5f1ff;--surface:#fffcff;--surface2:#f1ebff;--text:#231e40;--muted:#776f93;--line:#e7dff9;--acc:#7a4ce2;--acc-soft:#ece3ff;--acc-text:#6a3bd3;--in:#11966b;--in-soft:#dcf6ec;--out:#d9466f;--out-soft:#fde4ec;--warn:#c27412;--warn-soft:#fff0dc;--shadow:0 8px 24px rgba(88,58,160,.09);--tabh:62px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#110f1e;--surface:#1c1a2e;--surface2:#262339;--text:#f6f3ff;--muted:#aaa3c4;--line:#322e4a;--acc:#a982ff;--acc-soft:#2f2650;--acc-text:#c9b0ff;--in:#45d6a1;--in-soft:#173a30;--out:#ff8eb0;--out-soft:#41212f;--warn:#ffbb5c;--warn-soft:#3d2c15;--shadow:0 8px 24px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#110f1e;--surface:#1c1a2e;--surface2:#262339;--text:#f6f3ff;--muted:#aaa3c4;--line:#322e4a;--acc:#a982ff;--acc-soft:#2f2650;--acc-text:#c9b0ff;--in:#45d6a1;--in-soft:#173a30;--out:#ff8eb0;--out-soft:#41212f;--warn:#ffbb5c;--warn-soft:#3d2c15;--shadow:0 8px 24px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,"Segoe UI",sans-serif;overflow-x:hidden;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
body.locked{position:fixed;left:0;right:0;width:100%;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--acc-text)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}.in{color:var(--in)}.out{color:var(--out)}
h1,h2,h3{margin:0;letter-spacing:-.02em}
[hidden]{display:none!important}

/* Encabezado */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--st)) 16px 10px;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px)}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;line-height:1.05;margin-right:auto}
.brand img{width:36px;height:36px;border-radius:11px;box-shadow:0 4px 10px rgba(110,70,200,.22)}
.brand small{display:block;color:var(--acc-text);font-size:12px;font-weight:800}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-size:17px;flex:0 0 38px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 11px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#aaa;flex:0 0 8px}
.s-ok i{background:var(--in)}.s-guardando i,.s-cargando i{background:var(--warn);animation:pulse 1s infinite alternate}.s-pendiente i{background:var(--out)}.s-local i{background:#999}
@keyframes pulse{to{opacity:.3}}

/* Contenido */
main{padding:4px 16px calc(var(--tabh) + var(--sb) + 28px);max-width:1080px;margin:0 auto}
.page-h{display:flex;align-items:center;gap:12px;margin:8px 0 14px}
.page-h img{width:46px;height:46px;border-radius:14px}
.page-h h1{font-size:26px;font-weight:800}
.page-h p{margin:2px 0 0;color:var(--muted);font-size:13px}
.page-h .btn{margin-left:auto}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--acc-text);font-weight:650;min-height:40px;margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-h h2{font-size:17px;font-weight:750}
.link{color:var(--acc-text);font-weight:650;font-size:14px;min-height:36px;display:inline-flex;align-items:center}
.grid2{display:grid;gap:12px}
.grid2>.card{margin-bottom:0}
.stack{display:grid;gap:12px;margin-bottom:12px}

/* Selector de mes */
.monthbar{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px;margin-bottom:12px}
.monthbar button{width:44px;height:40px;border-radius:12px;font-size:20px;color:var(--acc-text)}
.monthbar button:disabled{opacity:.3}
.monthbar b{font-size:15px}
.hero .monthbar{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.22)}
.hero .monthbar button,.hero .monthbar b{color:#fff}

/* Hero */
.hero{border-radius:26px;padding:16px 16px 18px;margin-bottom:12px;color:#fff;background:linear-gradient(135deg,#5f31b8 0%,#8656e6 55%,#5fb2ec 120%);box-shadow:0 14px 30px rgba(105,62,200,.28);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-90px;top:-150px;border:32px solid rgba(255,255,255,.08);pointer-events:none}
.hero .hi{font-size:14px;opacity:.9;margin-bottom:10px}
.hero .lbl{font-size:13px;opacity:.85}
.hero .big{font-size:36px;font-weight:800;margin:2px 0 12px;letter-spacing:-.03em}
.hero .io{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hero .io div{background:rgba(255,255,255,.15);border-radius:16px;padding:10px 12px}
.hero .io small{display:block;font-size:12px;opacity:.85}
.hero .io b{font-size:17px}
.hero .acc{font-size:12px;opacity:.8;margin-top:10px}

/* Métricas */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px;box-shadow:var(--shadow);text-align:left;min-width:0;display:block;width:100%}
.metric img{width:38px;height:38px;border-radius:12px;display:block;margin-bottom:6px}
.metric small{color:var(--muted);font-size:12px;display:block}
.metric b{font-size:18px;display:block;margin-top:2px;overflow-wrap:anywhere}
.metric:active,.tx:active,.tile:active{transform:scale(.98)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:14px;background:var(--acc);color:#fff;font-weight:700;font-size:15px;white-space:nowrap;text-decoration:none}
.btn.soft{background:var(--acc-soft);color:var(--acc-text)}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.danger{background:var(--out-soft);color:var(--out)}
.btn.sm{min-height:38px;padding:0 13px;font-size:14px;border-radius:12px}
.btn.block{width:100%}
.btn:active{filter:brightness(.94)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1}

/* Segmentos */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{min-height:38px;border-radius:11px;font-weight:650;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 2px 8px rgba(60,40,120,.12)}

/* Buscador */
.search{position:relative;margin-bottom:10px}
.search input{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 40px 0 40px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.search input:focus{border-color:var(--acc)}
.search svg{position:absolute;left:13px;top:13px;width:20px;height:20px;stroke:var(--muted)}
.search button{position:absolute;right:6px;top:6px;width:34px;height:34px;border-radius:10px;color:var(--muted);font-size:18px}

/* Listas de movimientos */
.day{font-size:13px;font-weight:700;color:var(--muted);margin:14px 4px 6px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.tx{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px;padding:11px 14px;width:100%;text-align:left;border-bottom:1px solid var(--line);transition:transform .12s}
.tx:last-child{border-bottom:0}
.emo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:21px;background:var(--surface2)}
.emo.in{background:var(--in-soft)}.emo.out{background:var(--out-soft)}
.tx .t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-weight:750;text-align:right;white-space:nowrap}
.tx .a small{display:block;font-weight:500;font-size:12px}
.sumline{display:flex;gap:14px;font-size:13px;color:var(--muted);margin:0 4px 4px;flex-wrap:wrap}
.sumline b{color:var(--text)}

/* Vacíos */
.empty{text-align:center;padding:26px 14px;color:var(--muted)}
.empty .e{font-size:38px;margin-bottom:6px}
.empty p{margin:0 0 12px}

/* Chips de estado */
.st{display:inline-block;font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.st.ok{background:var(--in-soft);color:var(--in)}.st.bad{background:var(--out-soft);color:var(--out)}.st.warn{background:var(--warn-soft);color:var(--warn)}

/* Tarjetas de deudas / préstamos / metas */
.item{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:15px;box-shadow:var(--shadow);margin-bottom:10px}
.item-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.item-h h3{font-size:16px;font-weight:750}
.item-h p{margin:2px 0 0;color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.kv div{background:var(--surface2);border-radius:14px;padding:9px 11px}
.kv small{display:block;color:var(--muted);font-size:12px}
.kv b{font-size:16px}
.bar{height:9px;border-radius:9px;background:var(--surface2);overflow:hidden;margin-top:10px}
.bar span{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--acc),#5fb2ec)}
.bar.warn span{background:var(--warn)}.bar.bad span{background:var(--out)}.bar.ok span{background:var(--in)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-top:7px}

/* Gráficas */
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:8px}
.chart .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:11px;color:var(--muted)}
.chart .m.cur{color:var(--text);font-weight:750}
.chart .bars{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.chart .bars i{width:min(14px,40%);border-radius:6px 6px 2px 2px;background:var(--in);min-height:3px}
.chart .bars i.o{background:var(--out)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i,.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.split{display:flex;align-items:center;gap:16px}
.donut{width:120px;height:120px;border-radius:50%;flex:0 0 120px;display:grid;place-items:center;position:relative}
.donut:after{content:"";position:absolute;inset:20px;border-radius:50%;background:var(--surface)}
.donut b{position:relative;z-index:1;font-size:13px;text-align:center;line-height:1.15}
.donut b small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.leg{flex:1;min-width:0;font-size:13px}
.leg div{display:flex;justify-content:space-between;gap:8px;padding:4px 0}
.leg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar{margin:10px 0}
.hbar .row{margin:0 0 5px;color:var(--text)}
.hbar .bar{margin-top:0;height:10px}

/* Calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:11px;color:var(--muted);font-weight:700;padding-bottom:4px}
.cal .d{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;position:relative;font-variant-numeric:tabular-nums}
.cal .d.today{background:var(--acc);color:#fff;font-weight:800}
.cal .d .dots{display:flex;gap:2px;height:6px;margin-top:2px}
.cal .d .dots i{width:5px;height:5px;border-radius:50%;background:var(--acc)}
.cal .d .dots i.ok{background:var(--in)}.cal .d .dots i.bad{background:var(--out)}.cal .d .dots i.warn{background:var(--warn)}
.cal .d.today .dots i{background:#fff}

/* Más */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--shadow);text-align:left;display:block;width:100%}
.tile img{width:52px;height:52px;border-radius:15px;display:block;margin-bottom:8px}
.tile b{display:block;font-size:16px}
.tile small{color:var(--muted);font-size:12.5px}

/* Resumen 3 cajas */
.boxes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:11px;min-width:0}
.box small{display:block;color:var(--muted);font-size:12px}
.box b{font-size:15px;overflow-wrap:anywhere}
.ytable{width:100%;border-collapse:collapse;font-size:13px}
.ytable th{text-align:right;color:var(--muted);font-weight:650;font-size:12px;padding:6px 4px;border-bottom:1px solid var(--line)}
.ytable th:first-child,.ytable td:first-child{text-align:left}
.ytable td{text-align:right;padding:8px 4px;border-bottom:1px solid var(--line)}
.ytable tr.cur td{font-weight:750}

/* Barra inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:6px 6px calc(6px + var(--sb));background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center;font-size:11px;font-weight:650;color:var(--muted);border-radius:14px}
.tab img{width:30px;height:30px;border-radius:9px;filter:saturate(.35) opacity(.75);transition:.15s}
.tab.on{color:var(--acc-text)}
.tab.on img{filter:none;transform:translateY(-1px) scale(1.06)}
.tab.add{align-self:center}
.tab.add span{width:56px;height:56px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,#6b3bd3,#8f5ff0 60%,#62b5ee);color:#fff;font-size:30px;font-weight:400;line-height:1;box-shadow:0 8px 18px rgba(106,59,211,.4);margin-top:-18px}

/* Hoja inferior (formularios) */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:none}
.sheet-wrap.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(20,12,40,.42);opacity:0;transition:opacity .2s}
.sheet-wrap.show .backdrop{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:calc(100% - 24px);display:flex;flex-direction:column;overflow:hidden;overflow:clip;background:var(--surface);border-radius:26px 26px 0 0;padding:8px 0 calc(12px + var(--sb));transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 30px rgba(0,0,0,.15)}
.sheet-wrap.show .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:2px auto 10px;flex:0 0 auto}
#sheetBody{display:flex;flex-direction:column;min-height:0;flex:1}
#sheetForm{display:flex;flex-direction:column;min-height:0;flex:1}
.sheet-scroll{overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 18px 6px;min-height:0;flex:1}
.sheet-foot{padding:8px 18px 0;border-top:1px solid var(--line);flex:0 0 auto}
.sheet-foot .btns{margin-top:0}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;padding:0 18px;flex:0 0 auto}
.sheet-h h2{font-size:20px;font-weight:800}
.sheet-h button{width:36px;height:36px;border-radius:50%;background:var(--surface2);font-size:18px;color:var(--muted)}
.field{margin-bottom:12px}
.field>label,.flabel{display:block;font-size:13px;font-weight:650;color:var(--muted);margin:0 0 6px 2px}
.field input,.field select,.field textarea{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);padding:11px 13px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.field input[type=date]{display:block;min-width:0}
.field input:focus,.field select:focus{border-color:var(--acc);background:var(--surface)}
.field select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.amount{position:relative}
.amount span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700}
.amount input{padding-left:30px;font-weight:700}
.amount.big input{font-size:30px!important;font-weight:800;text-align:center;min-height:58px;padding-left:13px}
.amount.big span{display:none}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips.rows2 .crow{display:flex;gap:7px;width:max-content}.chips.rows2 .crow+.crow{margin-top:7px}
.chips.rows2{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;margin:0 -18px;padding:0 18px 4px;scrollbar-width:none}
.chips.rows2::-webkit-scrollbar{display:none}
.chip{position:relative}.chip input{position:absolute;left:0;top:0;width:1px;height:1px;margin:0;opacity:0;pointer-events:none}
.chip span{display:inline-flex;align-items:center;gap:5px;min-height:38px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);font-size:14px;font-weight:600;cursor:pointer}
.chip input:checked+span{background:var(--acc);border-color:var(--acc);color:#fff}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:4px 0 12px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--acc);flex:0 0 22px;margin:0}
.hint{font-size:12.5px;color:var(--muted);margin:-4px 2px 12px}
.per button{font-size:13px;padding:0 2px}
.rango{margin-bottom:2px}
.paidline{margin-top:10px;font-size:13px;color:var(--in);font-weight:650}
.hrow{cursor:default}.hrow .s{white-space:normal}
.bell{position:relative}
.bell i{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--out);color:#fff;font:700 11px/18px -apple-system,system-ui,sans-serif;font-style:normal;padding:0 5px;text-align:center}
.alert-h{font-size:13px;font-weight:700;color:var(--muted);margin:12px 4px 6px}
/* Pantalla de ingreso con PIN */
.lock{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(20px + var(--st)) 24px calc(20px + var(--sb));overflow:auto}
.lock:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% -10%,rgba(140,90,240,.22),transparent 60%);pointer-events:none}
.lock-in{position:relative;width:100%;max-width:340px;text-align:center}
.lock-logo{width:76px;height:76px;border-radius:22px;box-shadow:0 10px 24px rgba(110,70,200,.3);margin-bottom:14px}
.lock h1{font-size:23px;font-weight:800;margin-bottom:4px}
.lock .sub{color:var(--muted);margin:0 0 18px;font-size:14.5px;min-height:20px}
.lock .field input{text-align:center;font-size:18px;min-height:52px}
.lock .btn{width:100%;min-height:50px;margin-top:8px}
.dots{display:flex;justify-content:center;gap:16px;margin:6px 0 10px}
.dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--acc);transition:.12s}
.dots i.f{background:var(--acc)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.lmsg{min-height:20px;font-size:13.5px;color:var(--out);margin-bottom:8px;font-weight:600}
.pad{display:grid;grid-template-columns:repeat(3,76px);justify-content:center;gap:12px 20px}
.pad button{width:76px;height:76px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:28px;font-weight:500;box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
.pad button:active{background:var(--acc-soft);transform:scale(.95)}
.pad button.k2{background:none;border:0;box-shadow:none;font-size:15px;font-weight:650;color:var(--acc-text)}
.pad button.k2:empty{visibility:hidden}
.lock .alt{margin-top:16px;color:var(--acc-text);font-weight:650;min-height:40px}
.lock.busy .pad{opacity:.4;pointer-events:none}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite;vertical-align:-3px}
@keyframes rot{to{transform:rotate(360deg)}}
@media (max-height:640px){.pad{grid-template-columns:repeat(3,64px);gap:8px 18px}.pad button{width:64px;height:64px;font-size:24px}.lock-logo{width:56px;height:56px;margin-bottom:8px}}

#toast{position:fixed;left:50%;bottom:calc(var(--tabh) + var(--sb) + 16px);transform:translate(-50%,20px);opacity:0;background:#2a2347;color:#fff;padding:11px 16px;border-radius:14px;font-size:14px;z-index:99;transition:.25s;max-width:calc(100vw - 32px);text-align:center;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.2)}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (hover:hover){.metric:hover,.tile:hover,.tx:hover{background:var(--surface2)}}
@media (min-width:700px){
 .metrics{grid-template-columns:repeat(4,minmax(0,1fr))}
 .grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
 .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
 .items2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.items2 .item{margin:0}
}
@media (min-width:900px){
 body{padding-left:96px}
 .tabs{top:0;right:auto;width:96px;grid-template-columns:1fr;grid-auto-rows:min-content;align-content:start;gap:8px;padding:90px 8px 16px;border-top:0;border-right:1px solid var(--line)}
 .tab.add{order:-1;margin-bottom:10px}.tab.add span{margin-top:0}
 main{padding:8px 28px 40px}.top{padding:14px 28px}
 #toast{bottom:24px}
 .sheet{bottom:auto;top:50%;border-radius:26px;transform:translateY(-40%);opacity:0;transition:.2s}
 .sheet-wrap.show .sheet{transform:translateY(-50%);opacity:1}
}
@media (max-width:350px){.hero .big{font-size:30px}.metric b{font-size:16px}.boxes{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
</style>

<script>
/* ===== Conexión, sesión y datos (v3) ===== */
const API_URL='https://script.google.com/macros/s/AKfycbx_IFhfQoULK6YlVflmzD9iPugZF2jgWCZBXs9m5Zt5IpbU1EfbLNT59BTTtFvi2YqD/exec'; // ← solo en GitHub: pega aquí la URL que termina en /exec
const IN_GAS=typeof google!=='undefined'&&!!(google.script&&google.script.run);
const API_OK=IN_GAS||/^https:\/\/script\.google(usercontent)?\.com\//.test(API_URL);
const COLS=['movements','debts','loans','budgets','goals','payments'];
const EMPTY=()=>({movements:[],debts:[],loans:[],budgets:[],goals:[],payments:[]});
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function parse(s,d){try{return s?JSON.parse(s):d}catch(e){return d}}
function uid(){try{return crypto.randomUUID()}catch(e){return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10)}}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function normalize(d){d=d||{};const o=EMPTY();COLS.forEach(c=>{o[c]=Array.isArray(d[c])?d[c].map(x=>Object.assign({},x)):[]});
 o.budgets.forEach(b=>{if(!b.category&&b.name)b.category=b.name;delete b.name});
 COLS.forEach(c=>o[c].forEach(x=>{if(!x.id)x.id=uid()}));return o}
/* SHA-256 compacto (para verificar el PIN en el teléfono sin conexión) */
function sha256(s){const K=[],H=[];let n=2,c=0;const isP=x=>{for(let i=2;i*i<=x;i++)if(x%i===0)return false;return true};const fr=x=>(x-Math.floor(x))*4294967296|0;
 while(c<64){if(isP(n)){if(c<8)H[c]=fr(Math.pow(n,1/2));K[c++]=fr(Math.pow(n,1/3))}n++}
 const b=unescape(encodeURIComponent(s)),l=b.length,w=[];for(let i=0;i<l;i++)w[i>>2]|=b.charCodeAt(i)<<(24-(i%4)*8);w[l>>2]|=0x80<<(24-(l%4)*8);w[((l+8>>6)+1)*16-1]=l*8;
 const r=(x,y)=>x>>>y|x<<(32-y);
 for(let j=0;j<w.length;j+=16){const W=[];let [a,b2,c2,d,e,f,g,h]=H;
  for(let i=0;i<64;i++){W[i]=i<16?w[j+i]|0:(r(W[i-2],17)^r(W[i-2],19)^W[i-2]>>>10)+W[i-7]+(r(W[i-15],7)^r(W[i-15],18)^W[i-15]>>>3)+W[i-16]|0;
   const t1=h+(r(e,6)^r(e,11)^r(e,25))+(e&f^~e&g)+K[i]+W[i]|0,t2=(r(a,2)^r(a,13)^r(a,22))+(a&b2^a&c2^b2&c2)|0;h=g;g=f;f=e;e=d+t1|0;d=c2;c2=b2;b2=a;a=t1+t2|0}
  H[0]=H[0]+a|0;H[1]=H[1]+b2|0;H[2]=H[2]+c2|0;H[3]=H[3]+d|0;H[4]=H[4]+e|0;H[5]=H[5]+f|0;H[6]=H[6]+g|0;H[7]=H[7]+h|0}
 return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}

let session=parse(lsGet('mf360_session'),null);
let data=EMPTY(),queue=[],sheetUrl='',unlocked=false;
let syncState=API_OK?'cargando':'local',syncError='',lastFetch=0;
const K=k=>'mf360_'+k+'_'+(session&&session.user?session.user.id:'x');
function loadLocal(){data=normalize(parse(lsGet(K('cache')),null));queue=parse(lsGet(K('queue')),[]);sheetUrl=lsGet(K('url'))||''}
function cache(){lsSet(K('cache'),JSON.stringify(data))}
function saveQueue(){lsSet(K('queue'),JSON.stringify(queue))}
function saveSession(){if(session)lsSet('mf360_session',JSON.stringify(session));else lsDel('mf360_session')}
function apiErr(msg,code){const e=new Error(msg||'Error');e.code=code||'ERR';return e}
function api(fn,...args){
 const req={fn,args,token:session&&session.token||''};
 if(IN_GAS)return new Promise((res,rej)=>google.script.run
  .withSuccessHandler(r=>{if(!r)return rej(apiErr('Sin respuesta','NET'));r.error?rej(apiErr(r.error,r.code)):res(r.data)})
  .withFailureHandler(e=>rej(apiErr(String(e&&e.message||e),'NET'))).mfApi(req));
 if(!API_OK)return Promise.reject(apiErr('Falta configurar el enlace de Google (API_URL).','NOAPI'));
 return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(req),redirect:'follow'})
  .then(r=>r.json()).catch(()=>{throw apiErr('Sin conexión con Google','NET')})
  .then(r=>{if(r&&r.error)throw apiErr(r.error,r.code);return r.data});
}
function applyOps(d,ops){ops.forEach(o=>{const arr=d[o.col];if(!arr)return;const i=arr.findIndex(x=>x.id===(o.op==='save'?o.item.id:o.id));
 if(o.op==='save'){if(i>=0)arr[i]=Object.assign({},o.item);else arr.push(Object.assign({},o.item))}else if(i>=0)arr.splice(i,1)});return d}
function upsert(col,item){applyOps(data,[{op:'save',col,item}]);cache();enqueue({op:'save',col,item})}
function removeItem(col,id){applyOps(data,[{op:'del',col,id}]);cache();enqueue({op:'del',col,id})}
function enqueue(op){queue.push(op);saveQueue();flush()}
let flushing=false,retryTimer=null;
async function flush(){
 if(!API_OK||!unlocked||!session||!session.token)return;
 if(flushing)return;
 if(!queue.length){if(syncState!=='cargando')setSync('ok');return}
 flushing=true;setSync('guardando');
 try{while(queue.length){const batch=queue.slice(0,40);await api('cambios',batch);queue.splice(0,batch.length);saveQueue()}setSync('ok')}
 catch(e){if(e.code==='AUTH')return authLost();syncError=e.message;setSync('pendiente');clearTimeout(retryTimer);retryTimer=setTimeout(flush,20000)}
 finally{flushing=false}
}
async function loadFromServer(){
 if(!API_OK){setSync('local');return}
 if(!unlocked||!session||!session.token)return;
 try{
  await flush();
  const r=await api('datos');lastFetch=Date.now();
  sheetUrl=r.url||'';lsSet(K('url'),sheetUrl);
  if(r.user){session.user=Object.assign(session.user,r.user);saveSession()}
  let server=normalize(r.data);
  if(!r.data||!Array.isArray(r.data.payments))server.payments=data.payments.slice(); // servidor sin pestaña Abonos (Code.gs viejo)
  const serverEmpty=COLS.every(c=>!server[c].length);
  if(serverEmpty&&session.user.principal&&!lsGet('mf360_migrado')){
   const old=normalize(parse(lsGet('mf360_cache'),null)||parse(lsGet('mf360_data'),null));
   if(COLS.some(c=>old[c].length)){setSync('guardando');await api('importar',old);server=old;toast('Tus registros anteriores se copiaron a tu Hoja ✓')}
  }
  if(!serverEmpty||session.user.principal)lsSet('mf360_migrado','1');
  data=applyOps(server,queue);cache();
  setSync(queue.length?'pendiente':'ok');
  safeRender();
  if(typeof maybeAlert==='function')maybeAlert();
 }catch(e){if(e.code==='AUTH')return authLost();syncError=e.message;setSync('pendiente')}
}
async function replaceAll(newData){
 data=normalize(newData);queue=[];saveQueue();cache();safeRender();
 if(!API_OK)return;
 setSync('guardando');
 try{await api('importar',data);setSync('ok')}catch(e){if(e.code==='AUTH')return authLost();syncError=e.message;setSync('pendiente');toast('No se pudo guardar en la Hoja. Revisa tu conexión.')}
}
const SYNC_TXT={cargando:'Cargando',guardando:'Guardando',ok:'Guardado',pendiente:'Sin conexión',local:'Solo local'};
const SYNC_LONG={cargando:'Conectando con tu Hoja de Google…',guardando:'Guardando cambios en tu Hoja de Google…',ok:'Todo está guardado en tu Hoja de Google.',pendiente:'No hay conexión con Google. Tus cambios están guardados en este teléfono y se subirán solos cuando vuelva la señal.',local:'Falta conectar la app con Google: los datos solo quedan en este teléfono.'};
function setSync(s){syncState=s;document.querySelectorAll('.sync').forEach(el=>{el.className='sync s-'+s;el.innerHTML='<i></i><span>'+SYNC_TXT[s]+'</span>';el.title=SYNC_LONG[s]});const l=document.getElementById('syncLong');if(l)l.textContent=SYNC_LONG[s]}
function toast(msg){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.textContent=msg;t.className='show';clearTimeout(t._h);t._h=setTimeout(()=>t.className='',3200)}
window.addEventListener('online',flush);

const NF=new Intl.NumberFormat('es-CO',{maximumFractionDigits:0});
const money=n=>{n=Math.round(Number(n)||0);return (n<0?'−':'')+'$ '+NF.format(Math.abs(n))};
const short=n=>{n=Number(n)||0;const a=Math.abs(n),s=n<0?'−':'';if(a>=1e6)return s+'$'+(a/1e6).toLocaleString('es-CO',{maximumFractionDigits:a>=1e7?0:1})+' M';if(a>=1e3)return s+'$'+Math.round(a/1e3)+' mil';return s+'$'+a};
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MES3=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const pad=n=>String(n).padStart(2,'0');
function pd(s){const p=String(s||'').split('-').map(Number);return p[0]?new Date(p[0],(p[1]||1)-1,p[2]||1):null}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addMonth(k,n){const p=k.split('-').map(Number);const d=new Date(p[0],p[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function monthName(k){const p=k.split('-');return cap(MESES[+p[1]-1])+' '+p[0]}
function daysIn(k){const p=k.split('-').map(Number);return new Date(p[0],p[1],0).getDate()}
function diffDays(a,b){return Math.round((pd(b)-pd(a))/864e5)}
function niceDate(s){const d=pd(s);if(!d)return '';const t=today();if(s===t)return 'Hoy';if(diffDays(s,t)===1)return 'Ayer';if(diffDays(s,t)===-1)return 'Mañana';return cap(DIAS[d.getDay()])+' '+d.getDate()+' de '+MESES[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' de '+d.getFullYear():'')}
function shortDate(s){const d=pd(s);return d?d.getDate()+' '+MES3[d.getMonth()].toLowerCase():'—'}
const amt=v=>Number(String(v==null?'':v).replace(/\D/g,''))||0;
const ico=k=>ICONS[k]||'';

const CATS={
 gasto:[['Hogar','🏠'],['Alimentación','🍽️'],['Transporte','🚌'],['Servicios','💡'],['Salud','🩺'],['Educación','🎓'],['Compras','🛍️'],['Entretenimiento','🎬'],['Deudas','💳'],['Préstamos','🤝'],['Ahorro','🐷'],['Otros','📦']],
 ingreso:[['Salario','💼'],['Capacitación','🎓'],['Ventas','🛒'],['Honorarios','🧾'],['Cobro de préstamo','🤝'],['Préstamo recibido','🏦'],['Otros ingresos','💰']]};
function catEmoji(c){for(const t in CATS){const f=CATS[t].find(x=>x[0]===c);if(f)return f[1]}return '🏷️'}
function catsFor(type){const base=CATS[type].map(x=>x[0]);const extra=[...new Set(data.movements.filter(m=>m.type===type).map(m=>m.category).filter(c=>c&&!base.includes(c)))];return base.concat(extra)}
const PALETTE=['#7a4ce2','#3fb5e8','#f0a03c','#e2557d','#1fb386','#a9a1c4'];

const S={tab:'inicio',month:today().slice(0,7),movType:'todos',q:'',pagos:'deudas',mas:null,per:'mes',day:today(),from:'',to:''};
let sheetOpen=false,renderLater=false;

const movesIn=k=>data.movements.filter(m=>String(m.date||'').startsWith(k));
const sumType=(arr,t)=>arr.filter(m=>m.type===t).reduce((a,m)=>a+(+m.amount||0),0);
function byCat(arr){const o={};arr.filter(m=>m.type==='gasto').forEach(m=>{o[m.category||'Otros']=(o[m.category||'Otros']||0)+(+m.amount||0)});return Object.entries(o).sort((a,b)=>b[1]-a[1])}
/* Una cuota cuenta como pagada si hay un abono ese mismo mes o en los 10 días antes de su fecha */
const paidFor=(ref,due)=>!!due&&payHistory(ref).some(p=>p.date.slice(0,7)===String(due).slice(0,7)||(p.date<due&&diffDays(p.date,due)<=10));
const paidIn=(ref,k)=>data.movements.some(m=>m.ref===ref&&String(m.date).startsWith(k))||data.payments.some(p=>p.ref===ref&&String(p.date).startsWith(k));
function events(k){
 const ev=[];
 data.debts.forEach(d=>{const day=+d.day;if(!day)return;const paid=paidFor('debt:'+d.id,k+'-'+pad(Math.min(day,daysIn(k))));if(+d.balance<=0&&!paid)return;
  ev.push({date:k+'-'+pad(Math.min(day,daysIn(k))),title:d.name,sub:d.entity||'Deuda',amount:+d.installment||0,kind:'debt',id:d.id,paid})});
 data.loans.forEach(l=>{const cobro=l.direction==='por cobrar';
  payHistory('loan:'+l.id).filter(p=>p.date.startsWith(k)).forEach(p=>ev.push({date:p.date,title:(cobro?'Te pagó ':'Pagaste a ')+l.person,sub:'Abono registrado',amount:p.amount,kind:'loan',id:l.id,paid:true,cobro}));
  if(!l.next||!String(l.next).startsWith(k)||+l.balance<=0||paidFor('loan:'+l.id,l.next))return;
  ev.push({date:l.next,title:(cobro?'Cobrar a ':'Pagar a ')+l.person,sub:'Préstamo · saldo',amount:+l.balance,kind:'loan',id:l.id,paid:false,cobro})});
 return ev.sort((a,b)=>a.date.localeCompare(b.date));
}
function evStatus(e){if(e.paid)return [e.cobro?'Cobrado':'Pagado','ok'];const n=diffDays(today(),e.date);if(n<0)return ['Vencido','bad'];if(n===0)return ['Hoy','warn'];if(n===1)return ['Mañana','warn'];return ['En '+n+' días',n<=5?'warn':'']}
function upcoming(){const k=today().slice(0,7);return events(k).concat(events(addMonth(k,1))).filter(e=>!e.paid&&diffDays(today(),e.date)<=10)}
/* ---- Abonos: historial ---- */
function payHistory(ref){
 const linked=new Set(data.payments.map(p=>p.move).filter(Boolean));
 const ps=data.payments.filter(p=>p.ref===ref).map(p=>({pid:p.id,move:p.move||'',date:String(p.date||''),amount:+p.amount||0,balance:p.balance,note:p.note||''}));
 const old=data.movements.filter(m=>m.ref===ref&&!linked.has(m.id)).map(m=>({pid:'',move:m.id,date:String(m.date||''),amount:+m.amount||0,balance:'',note:m.note||''}));
 return ps.concat(old).sort((a,b)=>b.date.localeCompare(a.date));
}
function lastPayLine(ref,cobro){const h=payHistory(ref);if(!h.length)return '';const p=h[0];
 return `<div class="paidline">✅ ${cobro?'Te pagaron':'Pagaste'} ${money(p.amount)} · ${shortDate(p.date)}${p.date.slice(0,4)!==today().slice(0,4)?' '+p.date.slice(0,4):''}</div>`}
function histBtn(ref){const n=payHistory(ref).length;return n?`<button class="btn sm soft" onclick="historyView('${ref}')">Historial (${n})</button>`:''}
function loanBadge(l){
 if(+l.balance<=0)return '<span class="st ok">Saldado ✓</span>';
 const cobro=l.direction==='por cobrar',m=today().slice(0,7),paidM=paidIn('loan:'+l.id,m);
 if((paidM&&(!l.next||String(l.next).slice(0,7)>m))||paidFor('loan:'+l.id,l.next))return `<span class="st ok">${cobro?'Cobrado este mes ✓':'Pagado este mes ✓'}</span>`;
 if(l.next){const nx=evStatus({date:l.next,paid:false});return `<span class="st ${nx[1]}">${shortDate(l.next)} · ${nx[0]}</span>`}
 return paidM?'<span class="st ok">Abonado este mes ✓</span>':'';
}
function sugNext(s){if(!s)return '';const k=addMonth(String(s).slice(0,7),1);return k+'-'+pad(Math.min(+String(s).slice(8,10)||1,daysIn(k)))}
function refItem(ref){const [kind,id]=ref.split(':');const it=data[kind==='debt'?'debts':'loans'].find(x=>x.id===id);if(!it)return null;
 return {kind,it,name:kind==='debt'?it.name:it.person,cobro:kind==='loan'&&it.direction==='por cobrar'}}
function historyView(ref){
 const r=refItem(ref);if(!r)return;const hs=payHistory(ref),tot=hs.reduce((a,h)=>a+h.amount,0);
 const rows=hs.map(h=>`<div class="tx hrow"><span class="emo in">✓</span><span style="min-width:0"><div class="t">${niceDate(h.date)}</div><div class="s">${h.balance!==''&&h.balance!=null?'Saldo después: '+money(h.balance):'Registrado como movimiento'}${h.note?' · '+esc(h.note):''}</div></span><span class="a num">${money(h.amount)}<small><button type="button" class="link" style="min-height:26px;font-size:12px" onclick="delPayment('${ref}','${h.pid}','${h.move}')">Eliminar</button></small></span></div>`).join('');
 const body=`<div class="boxes" style="grid-template-columns:1fr 1fr"><div class="box"><small>${r.cobro?'Total cobrado':'Total abonado'}</small><b class="num">${money(tot)}</b></div><div class="box"><small>Saldo hoy</small><b class="num">${money(Math.max(0,+r.it.balance||0))}</b></div></div>`+
  (hs.length?`<div class="list" style="box-shadow:none">${rows}</div><div class="btns"><button type="button" class="btn soft sm" onclick="downloadHistory('${ref}')">⬇ Descargar historial</button></div><div class="hint" style="margin-top:10px">También queda guardado en tu Hoja de Google, pestaña “Abonos”.</div>`:empty('🧾','Aún no hay abonos registrados.'));
 openSheet('Historial · '+esc(r.name),body,{submit:'Listo',onSubmit(){}});

 if(p==='anio'){const y=S.month.slice(0,4);return [y+'-01-01',y+'-12-31']}
 if(p==='rango'){const a=S.from||S.month+'-01',b=S.to||today();return a<=b?[a,b]:[b,a]}
 return [S.month+'-01',S.month+'-'+pad(daysIn(S.month))]}
function perLabel(){const [a,b]=perRange(),p=S.per;
 if(p==='dia'){const d=pd(a);const n=niceDate(a);return /^(Hoy|Ayer|Mañana)$/.test(n)?n+' · '+d.getDate()+' '+MES3[d.getMonth()].toLowerCase():n}

function payLoanForm(id){
 const l=data.loans.find(x=>x.id===id);if(!l)return;const cobro=l.direction==='por cobrar';
 openSheet((cobro?'Cobro · ':'Abono · ')+esc(l.person),`<p class="muted" style="margin:0 0 12px">Saldo actual: <b class="num">${money(l.balance)}</b></p>${fAmount('amount',cobro?'Valor que te pagaron':'Valor que pagaste','',true)}<div class="two">${fDate('date','Fecha',today())}${fDate('next','Próxima cuota',sugNext(l.next))}</div>${l.next?'<div class="hint">La próxima cuota se corrió un mes. Cámbiala o bórrala si no aplica.</div>':''}${fText('note','Nota o soporte (opcional)','','Ej. Efectivo, Nequi #1234')}<label class="check"><input type="checkbox" name="asMove" checked><span>Registrarlo también como ${cobro?'ingreso':'gasto'}</span></label>`,{submit:cobro?'Registrar cobro':'Registrar abono',
  onSubmit(fd){const a=amt(fd.get('amount'));if(!a)return 'Escribe el valor';
   const date=fd.get('date')||today(),note=(fd.get('note')||'').trim(),nb=Math.max(0,(+l.balance||0)-a);let mv='';
   if(fd.get('asMove')){mv=uid();upsert('movements',{id:mv,type:cobro?'ingreso':'gasto',amount:a,description:(cobro?'Abono de ':'Abono a ')+l.person,category:cobro?'Cobro de préstamo':'Préstamos',date,note,ref:'loan:'+l.id})}
   upsert('payments',{id:uid(),ref:'loan:'+l.id,title:(cobro?'Abono de ':'Abono a ')+l.person,date,amount:a,balance:nb,note,move:mv});
   upsert('loans',Object.assign({},l,{balance:nb,next:nb>0?(fd.get('next')||''):''}));toast(nb<=0?'¡Préstamo saldado! 🎉':(cobro?'Cobro registrado ✓':'Abono registrado ✓'))}});
}
/* ---- Presupuesto ---- */
function budgetForm(id){
 const b=id?data.budgets.find(x=>x.id===id):{};const used=data.budgets.filter(x=>x.id!==id).map(x=>x.category);const cs=catsFor('gasto').filter(c=>!used.includes(c)||c===b.category);
 openSheet(id?'Editar presupuesto':'Nuevo presupuesto',`<div class="field"><span class="flabel">Categoría de gasto</span><div class="chips">${cs.map((c,i)=>`<label class="chip"><input type="radio" name="category" value="${esc(c)}" ${(b.category?c===b.category:i===0)?'checked':''}><span>${catEmoji(c)} ${esc(c)}</span></label>`).join('')}</div></div>${fAmount('limit','Límite mensual',b.limit,true)}`,{
  onSubmit(fd){const lim=amt(fd.get('limit'));if(!lim)return 'Escribe el límite';const cat=fd.get('category');if(!cat)return 'Elige la categoría';upsert('budgets',{id:b.id||uid(),category:cat,limit:lim});toast('Presupuesto guardado ✓')},
  onDelete:id?()=>{if(!confirm('¿Eliminar este presupuesto?'))return false;removeItem('budgets',id)}:null});
}
/* ---- Metas ---- */
function goalForm(id){
 const g=id?data.goals.find(x=>x.id===id):{};
 openSheet(id?'Editar meta':'Nueva meta',`${fText('name','¿Para qué ahorras?',g.name,'Ej. Viaje, fondo de emergencia')}<div class="two">${fAmount('target','Valor de la meta',g.target)}${fAmount('saved','Ya tengo ahorrado',g.saved)}</div>${fDate('deadline','Fecha objetivo (opcional)',g.deadline)}`,{
  onSubmit(fd){const name=(fd.get('name')||'').trim();if(!name)return 'Escribe el nombre de la meta';const t=amt(fd.get('target'));if(!t)return 'Escribe el valor de la meta';upsert('goals',Object.assign({},g,{id:g.id||uid(),name,target:t,saved:amt(fd.get('saved')),deadline:fd.get('deadline')||''}));toast('Meta guardada ✓')},
  onDelete:id?()=>{if(!confirm('¿Eliminar esta meta?'))return false;removeItem('goals',id)}:null});
}
function goalDepositForm(id){
 const g=data.goals.find(x=>x.id===id);if(!g)return;
 openSheet('Abonar · '+esc(g.name),`<p class="muted" style="margin:0 0 12px">Llevas <b class="num">${money(g.saved)}</b> de ${money(g.target)}</p>${fAmount('amount','Valor del abono','',true)}<label class="check"><input type="checkbox" name="asExpense"><span>Descontarlo de mi balance (registrar como gasto “Ahorro”)</span></label>`,{submit:'Abonar',
  onSubmit(fd){const a=amt(fd.get('amount'));if(!a)return 'Escribe el valor';if(fd.get('asExpense'))upsert('movements',{id:uid(),type:'gasto',amount:a,description:'Ahorro · '+g.name,category:'Ahorro',date:today(),note:''});
   const s=(+g.saved||0)+a;upsert('goals',Object.assign({},g,{saved:s}));toast(s>=+g.target?'¡Meta cumplida! 🎉':'Abono registrado ✓')}});
}

/* ====================== Datos ====================== */
function wipeAll(){if(!confirm('¿Borrar TODOS tus registros, también en la Hoja de Google?'))return;if(!confirm('Esta acción no se puede deshacer. ¿Continuar?'))return;replaceAll(EMPTY());toast('Datos borrados')}
function importData(input){const f=input.files&&input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const d=parse(r.result,null);if(!d||!COLS.some(c=>Array.isArray(d[c]))){alert('Ese archivo no es una copia de Mis Finanzas 360°.');return}if(confirm('¿Reemplazar todos tus registros actuales por los de la copia?')){replaceAll(d);toast('Copia importada ✓')}};r.readAsText(f);input.value=''}
function exportData(){try{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mis-finanzas-'+userName().toLowerCase().replace(/\s+/g,'-')+'-'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}catch(e){toast('No se pudo descargar. Tus datos igual están en tu Hoja de Google.')}}

/* ====================== Ingreso con PIN ====================== */
const L={mode:'',name:'',pin:'',first:'',old:'',busy:false};
const pinHash=(salt,pin)=>sha256(salt+':'+pin);
function showLock(mode,msg){
 L.mode=mode;L.pin='';L.busy=false;unlocked=mode==='chg0'||mode==='chg1'||mode==='chg2'?unlocked:false;
 if(sheetOpen)closeSheet();
 const lk=$('#lock');lk.hidden=false;lk.classList.remove('busy');document.body.classList.add('locked');
 const nm=L.name||userName();
 const T={name:['Mis Finanzas 360°','¿Quién va a usar la app?'],login:['Hola, '+nm+' 👋','Ingresa tu PIN'],unlock:['Hola, '+nm+' 👋','Ingresa tu PIN'],
  new1:['Crea tu PIN','4 números que recuerdes, '+nm],new2:['Repite tu PIN','Para confirmar que quedó bien'],
  chg0:['Cambiar PIN','Escribe tu PIN actual'],chg1:['PIN nuevo','Escribe 4 números nuevos'],chg2:['Repite el PIN nuevo','Para confirmar']}[mode];
 $('#lockTitle').textContent=T[0];$('#lockSub').textContent=T[1];
 $('#lockName').hidden=mode!=='name';$('#lockPin').hidden=mode==='name';
 if(mode==='name'){const i=$('#lockNameIn');i.value=L.name||lsGet('mf360_lastname')||'';$('#lockNameMsg').textContent=msg||'';if(!API_OK)$('#lockNameMsg').textContent='Falta conectar la app con Google (revisa API_URL en las instrucciones).';return}
 const alt={login:'No soy '+nm,unlock:'Cambiar de usuario',new1:'Volver',new2:'Volver',chg0:'Cancelar',chg1:'Cancelar',chg2:'Cancelar'}[mode];
 $('#lockAlt').textContent=alt;$('#lockMsg').textContent=msg||'';drawDots();
}
function hideLock(){$('#lock').hidden=true;if(!sheetOpen)document.body.classList.remove('locked');document.body.style.top=''}
function drawDots(){document.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('f',i<L.pin.length))}
function pinError(msg,mode){const d=$('#dots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');if(navigator.vibrate)navigator.vibrate(120);
 setTimeout(()=>{if(mode)showLock(mode,msg);else{L.pin='';drawDots();$('#lockMsg').textContent=msg}},380)}
function setBusy(b){L.busy=b;$('#lock').classList.toggle('busy',b);if(b)$('#lockMsg').innerHTML='<span class="spin"></span>'}
$('#pad').innerHTML=[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-k="${n}">${n}</button>`).join('')+'<button type="button" class="k2" data-k=""></button><button type="button" data-k="0">0</button><button type="button" class="k2" data-k="del" aria-label="Borrar">⌫</button>';
$('#pad').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||L.busy)return;const k=b.dataset.k;if(k==='del'){L.pin=L.pin.slice(0,-1);drawDots();return}if(!k||L.pin.length>=4)return;
 L.pin+=k;drawDots();$('#lockMsg').textContent='';if(L.pin.length===4)setTimeout(submitPin,120)});
document.addEventListener('keydown',e=>{if($('#lock').hidden||$('#lockPin').hidden)return;if(/^\d$/.test(e.key)){const b=document.querySelector(`#pad [data-k="${e.key}"]`);b&&b.click()}else if(e.key==='Backspace'){document.querySelector('#pad [data-k=del]').click()}});
$('#lockAlt').onclick=()=>{const m=L.mode;if(m==='login'||m==='unlock'){if(m==='unlock')return logout();showLock('name')}else if(m==='new1'||m==='new2')showLock('name');else{hideLock();unlocked=true}};
$('#lockNameIn').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();nameNext(false)}});
function nameNext(isNew){const n=$('#lockNameIn').value.replace(/\s+/g,' ').trim();if(n.length<2){$('#lockNameMsg').textContent='Escribe tu nombre';return}
 if(!API_OK){$('#lockNameMsg').textContent='Falta conectar la app con Google (API_URL).';return}
 L.name=n;$('#lockNameIn').blur();showLock(isNew?'new1':'login')}
async function submitPin(){
 const pin=L.pin,m=L.mode;
 if(m==='unlock'){if(session&&session.hash&&pinHash(session.salt,pin)===session.hash)return openApp();
  if(!navigator.onLine)return pinError('PIN incorrecto');L.name=userName();L.mode='login';return submitPin()}
 if(m==='new1'){L.first=pin;return showLock('new2')}
 if(m==='new2'&&pin!==L.first)return pinError('Los PIN no coinciden. Inténtalo de nuevo.','new1');
 if(m==='chg0'){L.old=pin;return showLock('chg1')}
 if(m==='chg1'){L.first=pin;return showLock('chg2')}
 if(m==='chg2'){if(pin!==L.first)return pinError('Los PIN no coinciden.','chg1');setBusy(true);
  try{await api('cambiarPin',L.old,pin);session.salt=uid();session.hash=pinHash(session.salt,pin);saveSession();hideLock();unlocked=true;toast('PIN cambiado ✓')}
  catch(e){setBusy(false);if(e.code==='AUTH')return authLost();pinError(e.code==='NET'?'Sin conexión. Inténtalo con internet.':e.message,e.code==='BADPIN'?'chg0':null)}return}
 setBusy(true);
 try{const r=await api(m==='new2'?'registrar':'ingresar',L.name,pin);
  const prevId=session&&session.user&&session.user.id;
  session={token:r.token,user:r.user,salt:uid()};session.hash=pinHash(session.salt,pin);saveSession();lsSet('mf360_lastname',r.user.name);
  if(m==='new2')toast('¡Bienvenida/o, '+r.user.name+'! 🎉');openApp(prevId!==r.user.id)}
 catch(e){setBusy(false);
  if(e.code==='NOUSER'||e.code==='EXISTS'||e.code==='NAME')return showLock('name',e.message);
  pinError(e.code==='NET'?'Sin conexión. Conéctate a internet para entrar.':e.message,m==='new2'?'new1':null)}
}
function openApp(fresh){
 hideLock();unlocked=true;L.pin='';
 if(fresh){S.tab='inicio';S.mas=null;S.month=today().slice(0,7)}
 loadLocal();render();window.scrollTo(0,0);maybeAlert();
 if(Date.now()-lastFetch>30000||fresh)loadFromServer();else flush();
}
function lockNow(){showLock('unlock')}
function startChangePin(){showLock('chg0')}
function authLost(){if(session){session.token='';session.hash='';saveSession()}L.name=userName();showLock('login','Por seguridad, ingresa tu PIN de nuevo.')}
async function logout(){
 if(queue.length&&!confirm('Hay cambios que aún no se subieron a Google. Si cambias de usuario se perderán. ¿Continuar?'))return;
 if(session&&session.token)api('salir').catch(()=>{});
 lsDel(K('cache'));lsDel(K('queue'));lsDel(K('url'));
 session=null;saveSession();data=EMPTY();queue=[];sheetUrl='';lastFetch=0;L.name='';showLock('name');
}
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
 if(document.visibilityState==='hidden'){hiddenAt=Date.now();return}
 if(unlocked&&hiddenAt&&Date.now()-hiddenAt>3*60000)return showLock('unlock');
 if(unlocked){if(Date.now()-lastFetch>60000)loadFromServer();else flush()}
});
if(!IN_GAS&&'serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
applyTheme();
if(session&&session.token&&session.hash)showLock('unlock');
else if(session&&session.user){L.name=session.user.name;showLock('login')}
else showLock('name');
</script>
